<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата — TELE-OPTICS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header-main">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon" aria-hidden="true"></div>
        <div class="logo-text">
          <div class="logo-name">TELE-OPTICS</div>
          <div class="logo-domain">.ru</div>
        </div>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumbs">
      <a href="index.html">Главная</a>
      <span class="sep">/</span>
      <span class="current">Оплата</span>
    </div>

    <section class="section">
      <div class="section-header">
        <h1 class="section-title">Оплата</h1>
      </div>

      <div class="about-section" style="margin:0;">
        <p class="about-text">Страница оплаты — каркас под макет. Секции/иконки добавишь позже.</p>
        <div class="features-strip" style="margin:0;">
          <div class="feature-item">
            <div class="feature-icon">💳</div>
            <div class="feature-text">
              <div class="feature-title">Банковской картой</div>
              <div class="feature-desc">VISA / MasterCard / МИР</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="feature-icon">🏦</div>
            <div class="feature-text">
              <div class="feature-title">Безналичный расчёт</div>
              <div class="feature-desc">Для юр. лиц</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="feature-icon">📦</div>
            <div class="feature-text">
              <div class="feature-title">Оплата при получении</div>
              <div class="feature-desc">Возможности зависят от службы</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="feature-icon">🔁</div>
            <div class="feature-text">
              <div class="feature-title">Возврат средств</div>
              <div class="feature-desc">Согласно правилам</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div class="footer-copyright">© 2024 TELE-OPTICS</div>
      </div>
    </div>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
